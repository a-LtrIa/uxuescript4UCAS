name: 问题反馈
description: 报告脚本运行异常或课程页面不兼容问题。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。日志和截图请移除账号、Cookie 与 URL 中的令牌，无需提供登录凭据。
  - type: input
    id: version
    attributes:
      label: 脚本版本
      description: 在 Tampermonkey 管理面板中查看版本，或填写下载来源与提交号。
      placeholder: 版本号或 commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 安装方式
      options:
        - Tampermonkey 正式发行版
        - 从源码构建
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与浏览器
      description: 填写系统版本、浏览器名称与版本。
      placeholder: Windows 11 / macOS 版本；Edge 或 Chrome 版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 问题现象与复现步骤
      description: 说明做了什么、期望发生什么、实际停在哪里，以及是否每次出现。
      placeholder: |
        1. 打开……
        2. 点击……
        预期：……
        实际：……
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关课程信息
      description: 仅填写与问题有关的项目；页面地址保留域名和路径即可。
      placeholder: |
        课程问题：视频 / PDF / 互动题 / 章节测验，页面域名与路径。
        页面是否位于国科大在线？PDF 阅读器是否已经加载？
  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图
      description: 可粘贴浏览器控制台中脱敏后的日志或拖入截图。
