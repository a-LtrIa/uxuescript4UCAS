name: 功能建议
description: 描述希望解决的实际问题和预期行为。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 请先搜索已有建议。一条 Issue 聚焦一个需求，便于讨论和跟进。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景、当前限制以及它造成的影响。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 说明期望的操作和结果；有具体例子更便于理解。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或补充材料
      description: 可填写目前的处理方式、参考实现或示意图。
