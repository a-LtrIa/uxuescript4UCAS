name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    name: Run checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish userscript
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript
        run: |
          pnpm build
          VERSION="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("config/build.json", "utf8")).version)')"
          test "$VERSION" = "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=".github/release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/scripts/uxuescript.user.js --clobber
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/scripts/uxuescript.user.js \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/scripts/uxuescript.user.js \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
